services:
  - type: web
    name: personal-vault-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: FRONTEND_URL
        sync: false
